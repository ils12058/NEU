[workspace]
members = ["boot/neuboot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
uefi = { version = "=0.41.0", default-features = false, features = ["panic_handler"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
